<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" className="w-full h-auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" fill="url(#bgGrad)" />
  <rect width="960" height="480" fill="url(#gridPattern)" opacity="0.6" />
  <rect x="10" y="10" width="940" height="460" rx="8" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Schematic Title Block -->
  <g id="titleBlock" transform="translate(30, 40)">
    <rect x="0" y="0" width="900" height="44" rx="4" fill="#1e293b" opacity="0.8" stroke="#475569" stroke-width="1" />
    <text x="20" y="27" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">RFC-0013 // CLOSED-LOOP BIO-PITCH &amp; CERAMIC AGGREGATE (BCA) PACKAGING ENGINE</text>
    <text x="740" y="27" fill="#94a3b8" font-family="monospace" font-size="11">FOUR-STAGE RECYCLING SCHEMATIC</text>
  </g>

  <!-- Module 1: Thermal Stripper & Coarse Breaker -->
  <g id="module1" transform="translate(40, 110)">
    <rect x="0" y="0" width="190" height="230" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#78350f" opacity="0.4" />
    <text x="12" y="19" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">MODULE 1: THERMAL BREAKER</text>
    
    <!-- Inflow indicator -->
    <path d="M 95 -25 L 95 0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
    <text x="95" y="-30" fill="#fcd34d" font-family="monospace" font-size="9" text-anchor="middle">SPENT CONTAINERS IN</text>

    <!-- Twin Toothed Rollers -->
    <circle cx="65" cy="85" r="30" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="125" cy="85" r="30" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Teeth representations -->
    <path d="M 65 55 L 68 62 L 75 60 L 73 68 L 80 72 L 74 77 L 78 85 L 70 87 L 72 95 L 65 92" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 125 55 L 122 62 L 115 60 L 117 68 L 110 72 L 116 77 L 112 85 L 120 87 L 118 95 L 125 92" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    
    <text x="95" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Low-RPM Toothed Shafts</text>
    <text x="95" y="156" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">2mm Tooth Clearance</text>
    <text x="95" y="172" fill="#f59e0b" font-family="monospace" font-size="9" text-anchor="middle">220°C Thermal Break</text>
    <text x="95" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Preserves 1-3mm Grog</text>
    <text x="95" y="210" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Zero Ball-Mill Dust</text>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <g id="flow12" transform="translate(230, 220)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="20" y="-10" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">1-3mm Grog</text>
  </g>

  <!-- Module 2: Heated Pug Auger & Injector -->
  <g id="module2" transform="translate(275, 110)">
    <rect x="0" y="0" width="190" height="230" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#0c4a6e" opacity="0.4" />
    <text x="12" y="19" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">MODULE 2: PUG AUGER</text>

    <!-- Pitch Injection Port -->
    <path d="M 95 -25 L 95 0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
    <text x="95" y="-30" fill="#f59e0b" font-family="monospace" font-size="9" text-anchor="middle">BIO-PITCH (150°C)</text>

    <!-- Auger Screw Graphic -->
    <rect x="25" y="65" width="140" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <line x1="25" y1="85" x2="165" y2="85" stroke="#94a3b8" stroke-width="2" />
    <path d="M 35 65 L 45 105 M 60 65 L 70 105 M 85 65 L 95 105 M 110 65 L 120 105 M 135 65 L 145 105" stroke="#38bdf8" stroke-width="2" />

    <text x="95" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Jacketed 304 SS Barrel</text>
    <text x="95" y="156" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Electric Heater Bands</text>
    <text x="95" y="172" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">12-18% Wt Pitch Ratio</text>
    <text x="95" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Continuous Shear Mixing</text>
    <text x="95" y="210" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Homogeneous Hot Mastic</text>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <g id="flow23" transform="translate(465, 220)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="20" y="-10" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">Hot Mastic</text>
  </g>

  <!-- Module 3: Variable-Aperture Forming Head -->
  <g id="module3" transform="translate(510, 110)">
    <rect x="0" y="0" width="190" height="230" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#581c87" opacity="0.4" />
    <text x="12" y="19" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">MODULE 3: FORMING RAM</text>

    <!-- Variable Die Graphic -->
    <rect x="35" y="55" width="120" height="60" rx="2" fill="#1e293b" stroke="#6b21a8" stroke-width="1.5" />
    <rect x="65" y="70" width="60" height="30" rx="2" fill="#090d16" stroke="#c084fc" stroke-width="1.5" />
    <!-- Overlapping Gate Plate Arrows -->
    <path d="M 65 50 L 65 68" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 125 50 L 125 68" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 160 85 L 127 85" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 30 85 L 63 85" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow)" />

    <text x="95" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">4-Way Stepper Gates</text>
    <text x="95" y="156" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Lead-Screw Ram (1.5kN)</text>
    <text x="95" y="172" fill="#c084fc" font-family="monospace" font-size="9" text-anchor="middle">Variable Box Profile (XxY)</text>
    <text x="95" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Base Ram Stamping Floor</text>
    <text x="95" y="210" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Zero Secondary Assembly</text>
  </g>

  <!-- Flow Arrow 3 to 4 -->
  <g id="flow34" transform="translate(700, 220)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)" />
    <text x="20" y="-10" fill="#10b981" font-family="monospace" font-size="8" text-anchor="middle">Extrusion</text>
  </g>

  <!-- Module 4: Flying Shear & Flash Sinter -->
  <g id="module4" transform="translate(745, 110)">
    <rect x="0" y="0" width="180" height="230" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#064e3b" opacity="0.4" />
    <text x="12" y="19" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">MODULE 4: SHEAR &amp; CURE</text>

    <!-- Music Wire & Radiant Tunnel Graphic -->
    <line x1="30" y1="65" x2="150" y2="65" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" />
    <rect x="45" y="80" width="90" height="35" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="90" y="102" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BCA BOX</text>

    <text x="90" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Spring Music-Wire Shear</text>
    <text x="90" y="156" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Programmed Z Height Cut</text>
    <text x="90" y="172" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">180°C Flash Radiant Zone</text>
    <text x="90" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Instant Rigid Release</text>
    <text x="90" y="210" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Waterproof &amp; Biodegradable</text>
  </g>

  <!-- Closed Loop Feedback Pipe (Bottom Return) -->
  <g id="closedLoop" transform="translate(40, 360)">
    <path d="M 795 0 L 795 60 L 95 60 L 95 0" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
    <rect x="360" y="48" width="240" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="480" y="64" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">100% CLOSED-LOOP THERMAL RECYCLE (250°C)</text>
  </g>

  <!-- Footnote Block -->
  <g id="footerMetadata" transform="translate(40, 445)">
    <text x="0" y="15" fill="#64748b" font-family="sans-serif" font-size="9">Bio-Pitch &amp; Ceramic Aggregate (BCA) • ag-diy Zero-Plastic Architecture • Standard Tool ID: TOOL-BCA-PRESS-01</text>
    <text x="880" y="15" fill="#10b981" font-family="monospace" font-size="9" text-anchor="end">STATUS: CANONICAL SPECIFICATION</text>
  </g>
</svg>
