<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background &amp; Engineering Grid -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- Outer Blueprint Frame -->
  <rect x="20" y="20" width="920" height="500" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="25" y="25" width="910" height="490" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header Block -->
  <path d="M 25 25 L 935 25 L 935 85 L 25 85 Z" fill="#0f172a" opacity="0.85"/>
  <line x1="25" y1="85" x2="935" y2="85" stroke="#f59e0b" stroke-width="2"/>
  
  <text x="45" y="55" font-family="monospace" font-size="13" font-weight="bold" fill="#f59e0b" letter-spacing="2">OPEN BIOSPHERE // TECHNICAL BLUEPRINT SPECIFICATION</text>
  <text x="45" y="75" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Revolving Sprout Bioreactor Drum</text>
  
  <rect x="710" y="42" width="205" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="812" y="61" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">STAGE 1 // ELECTROMECHANICAL</text>

  <!-- Technical Drawing Core -->

  <!-- STAGE 1: ELECTROMECHANICAL &amp; BLE VIRTUAL PANEL -->
  <g transform="translate(60, 115)">
    <!-- Motorized Actuator Block -->
    <rect x="30" y="70" width="230" height="220" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="45" y="95" font-family="monospace" font-size="11" fill="#f59e0b">ACTUATION // DC POWERTRAIN</text>
    <rect x="50" y="120" width="190" height="85" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="145" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">MOTOR DRIVE / PUMP</text>
    <text x="145" y="170" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle">12V / 24V DC MOTOR</text>
    <rect x="50" y="220" width="190" height="50" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="145" y="245" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Slip-Clutch Manual Backup</text>

    <!-- Strict Two-Control Enclosure -->
    <rect x="290" y="70" width="260" height="220" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="305" y="95" font-family="monospace" font-size="11" fill="#f59e0b">STRICT TWO-CONTROL STANDARD</text>
    
    <!-- Control 1 -->
    <rect x="310" y="115" width="220" height="50" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="335" cy="140" r="10" fill="#ef4444"/>
    <text x="355" y="138" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">CONTROL 1: MASTER DC SWITCH</text>
    <text x="355" y="152" font-family="monospace" font-size="10" fill="#94a3b8">True Hardware DC Power Cut</text>

    <!-- Control 2 -->
    <rect x="310" y="175" width="220" height="50" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="335" cy="200" r="10" fill="#3b82f6"/>
    <text x="355" y="198" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">CONTROL 2: SD RESET BUTTON</text>
    <text x="355" y="212" font-family="monospace" font-size="10" fill="#94a3b8">Recessed Tactile Factory Restore</text>

    <!-- OLED Status Display -->
    <rect x="310" y="235" width="220" height="35" rx="3" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
    <text x="420" y="257" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">[SPROUT-01-A1 | BLE READY]</text>

    <!-- Mobile Virtual Panel Over BLE -->
    <rect x="580" y="70" width="260" height="220" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="595" y="95" font-family="monospace" font-size="11" fill="#a78bfa">VIRTUAL PANEL // BLE GATT</text>
    
    <rect x="600" y="115" width="220" height="155" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="710" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">FLUTTER COMPANION APP</text>
    <text x="710" y="165" font-family="sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">Touch Jogs / Sliders / Prime</text>
    <rect x="630" y="185" width="160" height="30" rx="4" fill="#3b82f6" opacity="0.8"/>
    <text x="710" y="205" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">VIRTUAL TOUCH CONTROLS</text>
    <text x="710" y="245" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">&lt;-- Ephemeral BLE (0 Contention) --&gt;</text>

    <!-- Wireless Radio Link -->
    <path d="M 550 180 Q 565 170 580 180" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 545 180 Q 565 160 585 180" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Blueprint Title Block Footer -->
  <path d="M 25 465 L 935 465 L 935 515 L 25 515 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="465" x2="935" y2="465" stroke="#334155" stroke-width="1.5"/>

  <text x="45" y="490" font-family="monospace" font-size="10" fill="#94a3b8">DWG NO: <tspan fill="#f8fafc" font-weight="bold">SPROUT-01-S1</tspan></text>
  <text x="45" y="505" font-family="monospace" font-size="10" fill="#94a3b8">REVISION: <tspan fill="#f8fafc">v2.4 (RFC-0007)</tspan></text>

  <text x="320" y="490" font-family="monospace" font-size="10" fill="#94a3b8">ARCHITECTURE: <tspan fill="#f8fafc">Stage 1: Electromechanical Pack (BLE Virtual Panel)</tspan></text>
  <text x="320" y="505" font-family="sans-serif" font-size="10" fill="#cbd5e1">24V DC Planetary Gearmotor, Strict Two-Control Box &amp; BLE Virtual Panel</text>

  <text x="820" y="490" font-family="monospace" font-size="10" fill="#94a3b8">SCALE: <tspan fill="#f8fafc">1:1 SCHEMATIC</tspan></text>
  <text x="820" y="505" font-family="monospace" font-size="10" fill="#f59e0b">STATUS: APPROVED</text>
</svg>
