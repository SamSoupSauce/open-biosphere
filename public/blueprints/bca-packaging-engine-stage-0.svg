<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <pattern id="grid0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#090d16" />
  <rect width="960" height="540" fill="url(#grid0)" opacity="0.6" />
  <rect x="15" y="15" width="930" height="510" fill="none" stroke="#334155" stroke-width="1.5" />
  
  <!-- Title Block -->
  <rect x="35" y="35" width="890" height="45" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="55" y="63" fill="#f59e0b" font-family="monospace" font-size="14" font-weight="bold">BCA PACKAGING ENGINE // STAGE 0: ZERO-POWER MECHANICAL BASELINE</text>
  <text x="760" y="63" fill="#94a3b8" font-family="monospace" font-size="11">MANUAL ELEVATION SCHEMATIC</text>

  <!-- Heavy Angle Iron Chassis -->
  <rect x="80" y="120" width="800" height="340" rx="4" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 4" />
  <text x="100" y="145" fill="#64748b" font-family="monospace" font-size="11">STRUCTURAL ANGLE-IRON CHASSIS (50x50x4mm)</text>

  <!-- Subsystem 1: Hand-Crank Toothed Breaker -->
  <g transform="translate(120, 180)">
    <rect x="0" y="0" width="180" height="220" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="25" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">1. TOOTHED BREAKER</text>
    <circle cx="60" cy="80" r="32" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="120" cy="80" r="32" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Hand Crank -->
    <line x1="120" y1="80" x2="160" y2="40" stroke="#f59e0b" stroke-width="3" />
    <circle cx="160" cy="40" r="6" fill="#fcd34d" />
    <text x="90" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Manual Ratchet Crank</text>
    <text x="90" y="155" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">2mm Tooth Clearance</text>
    <text x="90" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Gravity Drop to Hopper</text>
    <text x="90" y="195" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">Zero Electric Power</text>
  </g>

  <!-- Subsystem 2: Manual Screw Ram Pug Mill -->
  <g transform="translate(350, 180)">
    <rect x="0" y="0" width="230" height="220" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="15" y="25" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">2. ACME SCREW RAM &amp; PUG</text>
    <rect x="30" y="60" width="170" height="40" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <line x1="10" y1="80" x2="190" y2="80" stroke="#94a3b8" stroke-width="3" />
    <!-- Hand Wheel -->
    <circle cx="20" cy="80" r="18" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <text x="115" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Hand Wheel Acme Lead-Screw</text>
    <text x="115" y="155" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">304 SS Jacketed Barrel</text>
    <text x="115" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Pre-Heated Biomass Pitch</text>
    <text x="115" y="195" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">1.2 kN Manual Compaction</text>
  </g>

  <!-- Subsystem 3: Manual Bow Wire Slicer & Bench Plate -->
  <g transform="translate(630, 180)">
    <rect x="0" y="0" width="210" height="220" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="25" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">3. DIE &amp; TENSION BOW</text>
    <rect x="35" y="55" width="140" height="50" rx="2" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <!-- Tension Bow Wire -->
    <path d="M 45 45 Q 105 30 165 45" fill="none" stroke="#f59e0b" stroke-width="2" />
    <line x1="45" y1="45" x2="165" y2="45" stroke="#fcd34d" stroke-width="1" stroke-dasharray="2 2" />
    <text x="105" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Fixed-Profile 304 SS Die</text>
    <text x="105" y="155" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Spring Music-Wire Bow</text>
    <text x="105" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Benchtop Hot-Plate Cure</text>
    <text x="105" y="195" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">Rigid Pot in &lt; 5 Min</text>
  </g>

  <!-- Bottom Datum Line -->
  <line x1="80" y1="480" x2="880" y2="480" stroke="#f59e0b" stroke-width="1.5" />
  <text x="480" y="500" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">PRIMARY DATUM Z=0 // BENCHTOP MANUAL LEVEL</text>
</svg>