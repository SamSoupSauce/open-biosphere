<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#090d16" />
  <rect width="960" height="540" fill="url(#grid1)" opacity="0.6" />
  <rect x="15" y="15" width="930" height="510" fill="none" stroke="#334155" stroke-width="1.5" />
  
  <!-- Title Block -->
  <rect x="35" y="35" width="890" height="45" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="55" y="63" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">BCA PACKAGING ENGINE // STAGE 1: ELECTROMECHANICAL &amp; BLE VIRTUAL PANEL</text>
  <text x="740" y="63" fill="#94a3b8" font-family="monospace" font-size="11">BLE RETROFIT SCHEMATIC</text>

  <!-- Subsystem 1: Motorized Gear Drive -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="240" height="260" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="15" y="25" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">1. 12V 250W DC GEAR DRIVE</text>
    <rect x="40" y="55" width="160" height="65" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="120" cy="87" r="22" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
    <text x="120" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">High-Torque Planetary Gearhead</text>
    <text x="120" y="170" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Chain Drive to Twin Breaker</text>
    <text x="120" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Reversible Jog / Jam Clearing</text>
    <text x="120" y="215" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">Current-Limit Protection</text>
  </g>

  <!-- Subsystem 2: Ceramic Band Heaters & PID Loop -->
  <g transform="translate(340, 140)">
    <rect x="0" y="0" width="260" height="260" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="25" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">2. BAND HEATERS &amp; PID</text>
    <rect x="45" y="55" width="170" height="50" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <!-- Heaters representation -->
    <path d="M 55 55 L 55 105 M 95 55 L 95 105 M 135 55 L 135 105 M 175 55 L 175 105 M 205 55 L 205 105" stroke="#f59e0b" stroke-width="2" />
    <text x="130" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Dual 300W Ceramic Bands</text>
    <text x="130" y="155" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">140°C - 220°C Closed Loop</text>
    <text x="130" y="175" fill="#f59e0b" font-family="monospace" font-size="9" text-anchor="middle">K-Type Thermocouple Probes</text>
    <text x="130" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Automatic Pitch Viscosity Hold</text>
    <text x="130" y="225" fill="#64748b" font-family="sans-serif" font-size="8" text-anchor="middle">Over-Temp Thermal Cutout</text>
  </g>

  <!-- Subsystem 3: Minimalist Two-Control Box & BLE Virtual Panel -->
  <g transform="translate(640, 140)">
    <rect x="0" y="0" width="260" height="260" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="25" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">3. TWO-CONTROL BOX &amp; BLE</text>
    <rect x="45" y="50" width="170" height="70" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <!-- 2 Physical Controls -->
    <circle cx="95" cy="85" r="14" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
    <text x="95" y="112" fill="#ef4444" font-family="monospace" font-size="8" text-anchor="middle">E-STOP</text>
    <circle cx="165" cy="85" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    <text x="165" y="112" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">RESTORE</text>
    <text x="130" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">RFC-0005 Minimalist Standard</text>
    <text x="130" y="170" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">Flutter BLE Virtual Panel</text>
    <text x="130" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Zero Dials / Zero Physical Sliders</text>
    <text x="130" y="215" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">250ms Hardware Deadman Watchdog</text>
  </g>

  <!-- Bottom Wire Harness Status -->
  <line x1="60" y1="460" x2="900" y2="460" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="480" y="485" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">24V DC ISOLATED POWER BUS // ESP32-S3 MACHINE NODE INTEGRATION</text>
</svg>