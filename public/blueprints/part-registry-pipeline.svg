<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background &amp; Engineering Grid -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="25" y="25" width="910" height="490" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header Block -->
  <path d="M 25 25 L 935 25 L 935 85 L 25 85 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="85" x2="935" y2="85" stroke="#38bdf8" stroke-width="2"/>
  
  <text x="45" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="2">OPEN BIOSPHERE // TECHNICAL VECTOR SPECIFICATION</text>
  <text x="45" y="74" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Global Part Registry Architecture &amp; BOM Schema</text>
  
  <rect x="690" y="42" width="245" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="813" y="61" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">RFC-0008 // PART PIPELINE</text>

  <!-- Content Graphic -->
  <g id="drawing-content">

    <!-- Column 1: Canonical Database -->
    <g transform="translate(60, 115)">
      <rect x="0" y="0" width="260" height="320" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 0 0 L 260 0 L 260 45 L 0 45 Z" fill="#1e293b" rx="8"/>
      <text x="130" y="28" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">CANONICAL DATABASE</text>
      <text x="130" y="68" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">src/data/parts.json</text>

      <g transform="translate(20, 95)">
        <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Strict JSON schema validation</text>
        <text x="0" y="40" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Global unique Part IDs (120+)</text>
        <text x="0" y="65" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Single source of procurement truth</text>
        <text x="0" y="90" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Automated unit &amp; bulk pricing</text>
        <text x="0" y="115" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Cross-subsystem inventory tracking</text>
        <text x="0" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Mechanical, Electrical, Fluidic</text>
      </g>
      
      <rect x="20" y="260" width="220" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="130" y="285" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">MACHINE-READABLE SSoT</text>
    </g>

    <!-- Flow Arrow 1 -> 2 -->
    <path d="M 320 275 L 350 275" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Column 2: Dedicated Doc Pages -->
    <g transform="translate(350, 115)">
      <rect x="0" y="0" width="260" height="320" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 0 0 L 260 0 L 260 45 L 0 45 Z" fill="#1e293b" rx="8"/>
      <text x="130" y="28" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">DEDICATED DOC PAGES</text>
      <text x="130" y="68" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">src/content/docs/parts/*</text>

      <g transform="translate(20, 95)">
        <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Human-readable component specs</text>
        <text x="0" y="40" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Verified vendor procurement links</text>
        <text x="0" y="65" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Interactive 3D CAD preview</text>
        <text x="0" y="90" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Downloadable STEP / STL / 3DS</text>
        <text x="0" y="115" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Cross-referenced machine list</text>
        <text x="0" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Fabrication tolerances &amp; notes</text>
      </g>
      
      <rect x="20" y="260" width="220" height="40" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="130" y="285" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">PUBLIC SPECIFICATION</text>
    </g>

    <!-- Flow Arrow 2 -> 3 -->
    <path d="M 610 275 L 640 275" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- Column 3: Machine Stage Linking -->
    <g transform="translate(640, 115)">
      <rect x="0" y="0" width="260" height="320" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <path d="M 0 0 L 260 0 L 260 45 L 0 45 Z" fill="#1e293b" rx="8"/>
      <text x="130" y="28" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">MACHINE STAGE BOMs</text>
      <text x="130" y="68" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">hardware/*/stage-*.mdx</text>

      <g transform="translate(20, 95)">
        <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Part 1 Bill of Materials linking</text>
        <text x="0" y="40" font-family="sans-serif" font-size="11" fill="#cbd5e1">• 1-click navigation to registry</text>
        <text x="0" y="65" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Direct download of CAD assets</text>
        <text x="0" y="90" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Exact quantities per stage</text>
        <text x="0" y="115" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Stage cost &amp; cumulative rollup</text>
        <text x="0" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Zero missing component links</text>
      </g>
      
      <rect x="20" y="260" width="220" height="40" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="130" y="285" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle">VERIFIED TRACEABILITY</text>
    </g>

  </g>

  <!-- Blueprint Title Block Footer -->
  <path d="M 25 485 L 935 485 L 935 515 L 25 515 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="485" x2="935" y2="485" stroke="#334155" stroke-width="1.5"/>

  <text x="45" y="505" font-family="monospace" font-size="10" fill="#94a3b8">SUBTITLE: <tspan fill="#f8fafc">Canonical parts.json Database, Dedicated Documentation &amp; Stage BOM Integration</tspan></text>
  <text x="690" y="505" font-family="monospace" font-size="10" fill="#94a3b8">STANDARD: <tspan fill="#38bdf8" font-weight="bold">RFC-0011 VECTOR SVG</tspan></text>
</svg>