<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background &amp; Engineering Grid -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="25" y="25" width="910" height="490" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header Block -->
  <path d="M 25 25 L 935 25 L 935 85 L 25 85 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="85" x2="935" y2="85" stroke="#38bdf8" stroke-width="2"/>
  
  <text x="45" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="2">OPEN BIOSPHERE // TECHNICAL VECTOR SPECIFICATION</text>
  <text x="45" y="74" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Controller Software Stack &amp; Core Daemons</text>
  
  <rect x="690" y="42" width="245" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="813" y="61" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">RFC-0006 // SOFTWARE LAYERS</text>

  <!-- Content Graphic -->
  <g id="drawing-content">

    <!-- Top: Mobile Flutter Companion -->
    <g transform="translate(180, 105)">
      <rect x="0" y="0" width="600" height="65" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="300" y="26" font-family="monospace" font-size="11" font-weight="bold" fill="#a78bfa" text-anchor="middle">FLUTTER COMPANION APP</text>
      <text x="300" y="46" font-family="sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">Connects via Direct BLE or Local Wi-Fi (https://192.168.42.1:8443)</text>
      
      <path d="M 300 65 L 300 95" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
      <text x="315" y="84" font-family="monospace" font-size="9" fill="#a78bfa">Secure WebSocket / REST</text>
    </g>

    <!-- Middle: Controller Orchestration Daemon -->
    <g transform="translate(100, 205)">
      <rect x="0" y="0" width="760" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="25" y="28" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">CONTROLLER ORCHESTRATION DAEMON (biosphere-core // Python 3.10+ AsyncIO)</text>
      
      <g transform="translate(25, 45)">
        <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#f8fafc">• In-Memory Node Registry &amp; Global State Tree (/nodes/:id/tools)</text>
        <text x="0" y="34" font-family="sans-serif" font-size="11" fill="#f8fafc">• 250ms Periodic Heartbeat Dispatcher &amp; Watchdog Monitor</text>
        <text x="0" y="53" font-family="sans-serif" font-size="11" fill="#f8fafc">• Autonomous Harvest, Replenishment &amp; Crop Recipe Scheduler</text>
      </g>
    </g>

    <!-- Bottom Left: llama-cpp-python Engine -->
    <g transform="translate(100, 345)">
      <rect x="0" y="0" width="365" height="105" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <text x="20" y="25" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc">llama-cpp-python ENGINE</text>
      <text x="20" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Quantized Local GGUF Reasoning</text>
      <text x="20" y="68" font-family="monospace" font-size="9" fill="#94a3b8">• Vision-Language Multimodal Evaluation</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#94a3b8">• Zero-Cloud Privacy &amp; Offline Operation</text>
    </g>

    <!-- Bottom Right: Wireless Mesh Gateway -->
    <g transform="translate(495, 345)">
      <rect x="0" y="0" width="365" height="105" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="25" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">WIRELESS MESH GATEWAY</text>
      <text x="20" y="48" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">hostapd + dnsmasq Embedded Stack</text>
      <text x="20" y="68" font-family="monospace" font-size="9" fill="#94a3b8">• SSID: POTFRM-&lt;CLUSTER_ID&gt;</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#94a3b8">• Deterministic MAC-Keyed Static Leases</text>
    </g>

    <!-- Connectors between middle and bottom -->
    <path d="M 280 315 L 280 345" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <path d="M 680 315 L 680 345" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

  </g>

  <!-- Blueprint Title Block Footer -->
  <path d="M 25 485 L 935 485 L 935 515 L 25 515 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="485" x2="935" y2="485" stroke="#334155" stroke-width="1.5"/>

  <text x="45" y="505" font-family="monospace" font-size="10" fill="#94a3b8">SUBTITLE: <tspan fill="#f8fafc">RFC-0006 Asynchronous Event Architecture, Neural GGUF &amp; Local Network</tspan></text>
  <text x="690" y="505" font-family="monospace" font-size="10" fill="#94a3b8">STANDARD: <tspan fill="#38bdf8" font-weight="bold">RFC-0011 VECTOR SVG</tspan></text>
</svg>