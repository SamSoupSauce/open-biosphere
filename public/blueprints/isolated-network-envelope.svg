<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background &amp; Engineering Grid -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="25" y="25" width="910" height="490" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header Block -->
  <path d="M 25 25 L 935 25 L 935 85 L 25 85 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="85" x2="935" y2="85" stroke="#a855f7" stroke-width="2"/>
  
  <text x="45" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#a855f7" letter-spacing="2">OPEN BIOSPHERE // TECHNICAL VECTOR SPECIFICATION</text>
  <text x="45" y="74" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Isolated Farm Network Envelope (192.168.42.0/24)</text>
  
  <rect x="690" y="42" width="245" height="28" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="813" y="61" font-family="monospace" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="middle">RFC-0006 // NETWORK TOPOLOGY</text>

  <!-- Content Graphic -->
  <g id="drawing-content">

    <!-- Central Controller Host -->
    <g transform="translate(260, 105)">
      <rect x="0" y="0" width="440" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
      <text x="220" y="28" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">CENTRAL CONTROLLER COMPUTING HOST</text>
      <text x="220" y="50" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">Static IP: 192.168.42.1 • Secure Port: 8443</text>
      <text x="220" y="70" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Wi-Fi AP SSID: POTFRM-4096 • DHCP Lease Pool: 192.168.42.10 - 250</text>
    </g>

    <!-- Network Trunk Lines -->
    <path d="M 480 195 L 480 230" stroke="#a855f7" stroke-width="2"/>
    <line x1="160" y1="230" x2="800" y2="230" stroke="#a855f7" stroke-width="2"/>
    
    <path d="M 160 230 L 160 260" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <path d="M 480 230 L 480 260" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <path d="M 800 230 L 800 260" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <text x="160" y="250" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="end">DHCP: .10 </text>
    <text x="480" y="250" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="end">DHCP: .25 </text>
    <text x="800" y="250" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="end">DHCP: .50 </text>

    <!-- Node 1 -->
    <g transform="translate(60, 265)">
      <rect x="0" y="0" width="200" height="95" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="100" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">SKIMMER NODE</text>
      <text x="100" y="44" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">ESP32-S3 Dual Core</text>
      <text x="100" y="62" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">IP: 192.168.42.10</text>
      <text x="100" y="80" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Downlink BLE Tools (x4)</text>
      
      <line x1="100" y1="95" x2="100" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
      <text x="100" y="132" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">[Auger / Pump / Weir]</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(380, 265)">
      <rect x="0" y="0" width="200" height="95" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">GANTRY NODE</text>
      <text x="100" y="44" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">ESP32-S3 Dual Core</text>
      <text x="100" y="62" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">IP: 192.168.42.25</text>
      <text x="100" y="80" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Downlink BLE Tools (x3)</text>
      
      <line x1="100" y1="95" x2="100" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowAmber)"/>
      <text x="100" y="132" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">[X / Y / Head Actuators]</text>
    </g>

    <!-- Node 3 -->
    <g transform="translate(700, 265)">
      <rect x="0" y="0" width="200" height="95" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="100" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">DOSER NODE</text>
      <text x="100" y="44" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">ESP32-S3 Dual Core</text>
      <text x="100" y="62" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">IP: 192.168.42.50</text>
      <text x="100" y="80" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Downlink BLE Tools (x4)</text>
      
      <line x1="100" y1="95" x2="100" y2="120" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowEmerald)"/>
      <text x="100" y="132" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">[Peristaltic / Sensors]</text>
    </g>

  </g>

  <!-- Blueprint Title Block Footer -->
  <path d="M 25 485 L 935 485 L 935 515 L 25 515 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="485" x2="935" y2="485" stroke="#334155" stroke-width="1.5"/>

  <text x="45" y="505" font-family="monospace" font-size="10" fill="#94a3b8">SUBTITLE: <tspan fill="#f8fafc">Private Local Subnet Topology, Dynamic DHCP &amp; Encrypted Machine Handshake</tspan></text>
  <text x="690" y="505" font-family="monospace" font-size="10" fill="#94a3b8">STANDARD: <tspan fill="#a855f7" font-weight="bold">RFC-0011 VECTOR SVG</tspan></text>
</svg>