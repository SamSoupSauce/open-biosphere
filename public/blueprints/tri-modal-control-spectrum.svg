<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background &amp; Engineering Grid -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="25" y="25" width="910" height="490" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header Block -->
  <path d="M 25 25 L 935 25 L 935 85 L 25 85 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="85" x2="935" y2="85" stroke="#38bdf8" stroke-width="2"/>
  
  <text x="45" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="2">OPEN BIOSPHERE // TECHNICAL VECTOR SPECIFICATION</text>
  <text x="45" y="74" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Open Biosphere Tri-Modal Control Standard</text>
  
  <rect x="690" y="42" width="245" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="813" y="61" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">CONTROL SPECTRUM</text>

  <!-- Content Graphic -->
  <g id="drawing-content">

    <!-- Column 1: Manual -->
    <g transform="translate(60, 105)">
      <rect x="0" y="0" width="260" height="340" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 0 0 L 260 0 L 260 45 L 0 45 Z" fill="#1e293b" rx="8"/>
      <text x="130" y="28" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">TIER 1: MANUAL OVERRIDE</text>
      <text x="130" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Zero Electrical Power Required</text>

      <g transform="translate(20, 85)">
        <circle cx="15" cy="15" r="8" fill="#38bdf8"/>
        <text x="35" y="19" font-family="sans-serif" font-size="11" fill="#f8fafc">Direct Hand Levers</text>

        <circle cx="15" cy="50" r="8" fill="#38bdf8"/>
        <text x="35" y="54" font-family="sans-serif" font-size="11" fill="#f8fafc">Rotary Hand Cranks</text>

        <circle cx="15" cy="85" r="8" fill="#38bdf8"/>
        <text x="35" y="89" font-family="sans-serif" font-size="11" fill="#f8fafc">Quarter-Turn Ball Valves</text>

        <circle cx="15" cy="120" r="8" fill="#38bdf8"/>
        <text x="35" y="124" font-family="sans-serif" font-size="11" fill="#f8fafc">Friction Clutches &amp; Slips</text>

        <circle cx="15" cy="155" r="8" fill="#38bdf8"/>
        <text x="35" y="159" font-family="sans-serif" font-size="11" fill="#f8fafc">Gravity Siphons &amp; Weirs</text>
      </g>

      <rect x="20" y="280" width="220" height="42" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="130" y="306" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">100% EMP &amp; Grid-Down Safe</text>
    </g>

    <!-- Column 2: BLE Virtual Panel -->
    <g transform="translate(350, 105)">
      <rect x="0" y="0" width="260" height="340" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 0 0 L 260 0 L 260 45 L 0 45 Z" fill="#1e293b" rx="8"/>
      <text x="130" y="28" font-family="monospace" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">TIER 2: BLE VIRTUAL PANEL</text>
      <text x="130" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Strict Two-Control Hardware Standard</text>

      <g transform="translate(20, 85)">
        <circle cx="15" cy="15" r="8" fill="#ef4444"/>
        <text x="35" y="19" font-family="sans-serif" font-size="11" fill="#f8fafc">Inline DC Power Switch</text>

        <circle cx="15" cy="50" r="8" fill="#3b82f6"/>
        <text x="35" y="54" font-family="sans-serif" font-size="11" fill="#f8fafc">SD Card Restore Button</text>

        <circle cx="15" cy="85" r="8" fill="#8b5cf6"/>
        <text x="35" y="89" font-family="sans-serif" font-size="11" fill="#f8fafc">Ephemeral BLE Link</text>

        <circle cx="15" cy="120" r="8" fill="#f59e0b"/>
        <text x="35" y="124" font-family="sans-serif" font-size="11" fill="#f8fafc">Flutter Touch Jogs</text>

        <circle cx="15" cy="155" r="8" fill="#f59e0b"/>
        <text x="35" y="159" font-family="sans-serif" font-size="11" fill="#f8fafc">No Fragile Panel Dials</text>
      </g>

      <rect x="20" y="280" width="220" height="42" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="130" y="306" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Corrosion-Proof Waterproofing</text>
    </g>

    <!-- Column 3: Autonomous AI -->
    <g transform="translate(640, 105)">
      <rect x="0" y="0" width="260" height="340" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
      <path d="M 0 0 L 260 0 L 260 45 L 0 45 Z" fill="#1e293b" rx="8"/>
      <text x="130" y="28" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">TIER 3: AGENTIC AI</text>
      <text x="130" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Closed-Loop Mesh Automation</text>

      <g transform="translate(20, 85)">
        <circle cx="15" cy="15" r="8" fill="#a855f7"/>
        <text x="35" y="19" font-family="sans-serif" font-size="11" fill="#f8fafc">Central Compute + Local NPU</text>

        <circle cx="15" cy="50" r="8" fill="#a855f7"/>
        <text x="35" y="54" font-family="sans-serif" font-size="11" fill="#f8fafc">Controller-Node-Tool (CNT)</text>

        <circle cx="15" cy="85" r="8" fill="#ef4444"/>
        <text x="35" y="89" font-family="sans-serif" font-size="11" fill="#f8fafc">250ms Edge Deadman Timers</text>

        <circle cx="15" cy="120" r="8" fill="#a855f7"/>
        <text x="35" y="124" font-family="sans-serif" font-size="11" fill="#f8fafc">Continuous Computer Vision</text>

        <circle cx="15" cy="155" r="8" fill="#a855f7"/>
        <text x="35" y="159" font-family="sans-serif" font-size="11" fill="#f8fafc">Autonomous Multi-Agent Loop</text>
      </g>

      <rect x="20" y="280" width="220" height="42" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="130" y="306" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">Complete Hands-Free Yield</text>
    </g>

  </g>

  <!-- Blueprint Title Block Footer -->
  <path d="M 25 485 L 935 485 L 935 515 L 25 515 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="485" x2="935" y2="485" stroke="#334155" stroke-width="1.5"/>

  <text x="45" y="505" font-family="monospace" font-size="10" fill="#94a3b8">SUBTITLE: <tspan fill="#f8fafc">Parallel Control Tiers: Manual Fallback, BLE Virtual Panel &amp; Agentic AI</tspan></text>
  <text x="690" y="505" font-family="monospace" font-size="10" fill="#94a3b8">STANDARD: <tspan fill="#38bdf8" font-weight="bold">RFC-0011 VECTOR SVG</tspan></text>
</svg>