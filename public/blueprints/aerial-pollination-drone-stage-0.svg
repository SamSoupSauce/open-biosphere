<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background & Engineering Grid -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- Outer Blueprint Frame -->
  <rect x="20" y="20" width="920" height="500" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="25" y="25" width="910" height="490" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header Block -->
  <path d="M 25 25 L 935 25 L 935 85 L 25 85 Z" fill="#0f172a" opacity="0.85"/>
  <line x1="25" y1="85" x2="935" y2="85" stroke="#38bdf8" stroke-width="2"/>
  
  <text x="45" y="55" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="2">OPEN BIOSPHERE // TECHNICAL BLUEPRINT SPECIFICATION</text>
  <text x="45" y="75" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Aerial Spotter & Pollination Drone</text>
  
  <rect x="710" y="42" width="205" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="812" y="61" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">STAGE 0 // PURE MECHANICAL</text>

  <!-- Technical Drawing Core -->

  <!-- STAGE 0: MECHANICAL ARCHITECTURE -->
  <g transform="translate(60, 115)">
    <!-- Base Chassis / Mounting Extrusions -->
    <rect x="30" y="70" width="460" height="220" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="45" y="95" font-family="monospace" font-size="12" fill="#94a3b8">SUB-ASSEMBLY // BASE CHASSIS &amp; STRUCTURAL KINEMATICS</text>

    <!-- Mechanical Components -->
    <rect x="60" y="120" width="180" height="130" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="150" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">PRIMARY KINEMATIC</text>
    <text x="150" y="170" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">MECHANICAL LINKAGE</text>
    <circle cx="150" cy="205" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 135 205 L 165 205 M 150 190 L 150 220" stroke="#f8fafc" stroke-width="2"/>

    <!-- Manual Hand-Crank / Lever Decoupling -->
    <rect x="290" y="120" width="170" height="130" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="375" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">MANUAL OVERRIDE</text>
    <text x="375" y="170" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">LEVER / CRANK COUPLING</text>
    <rect x="345" y="190" width="60" height="25" rx="3" fill="#334155" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="375" y="207" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">100% MECH</text>

    <!-- Mechanical Linkage Rod -->
    <line x1="240" y1="185" x2="290" y2="185" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="265" cy="185" r="5" fill="#f8fafc"/>

    <!-- Stage 0 Annotation Callout Box -->
    <rect x="530" y="70" width="310" height="220" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="550" y="100" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">SPECIFICATION &amp; LIMITS</text>
    <line x1="550" y1="110" x2="820" y2="110" stroke="#334155" stroke-width="1"/>

    <text x="550" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Electrical Power: <tspan fill="#38bdf8" font-weight="bold">0 Watts (Zero Power)</tspan></text>
    <text x="550" y="160" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Drive: <tspan fill="#f8fafc">100% Human Leverage / Gravity</tspan></text>
    <text x="550" y="185" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Interface: <tspan fill="#f8fafc">Direct Cranks, Levers, Valving</tspan></text>
    <text x="550" y="210" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Resilience: <tspan fill="#f8fafc">EMP / Blackout / Immersion Proof</tspan></text>
    <text x="550" y="235" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Decoupling: <tspan fill="#f8fafc">Friction Clutch / Slip Linkage</tspan></text>
    <text x="550" y="260" font-family="monospace" font-size="11" fill="#94a3b8">BOM TARGET: LOWEST CAPITAL TIER</text>
  </g>

  <!-- Blueprint Title Block Footer -->
  <path d="M 25 465 L 935 465 L 935 515 L 25 515 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="465" x2="935" y2="465" stroke="#334155" stroke-width="1.5"/>

  <text x="45" y="490" font-family="monospace" font-size="10" fill="#94a3b8">DWG NO: <tspan fill="#f8fafc" font-weight="bold">DRONE-01-S0</tspan></text>
  <text x="45" y="505" font-family="monospace" font-size="10" fill="#94a3b8">REVISION: <tspan fill="#f8fafc">v2.4 (RFC-0007)</tspan></text>

  <text x="320" y="490" font-family="monospace" font-size="10" fill="#94a3b8">ARCHITECTURE: <tspan fill="#f8fafc">Stage 0: Zero-Power Baseline (Pure Mechanical)</tspan></text>
  <text x="320" y="505" font-family="sans-serif" font-size="10" fill="#cbd5e1">Telescoping Carbon Manual Wand, Acoustic Tuning Mirror & Blossom Shaker</text>

  <text x="820" y="490" font-family="monospace" font-size="10" fill="#94a3b8">SCALE: <tspan fill="#f8fafc">1:1 SCHEMATIC</tspan></text>
  <text x="820" y="505" font-family="monospace" font-size="10" fill="#38bdf8">STATUS: APPROVED</text>
</svg>
