<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.75" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="dim-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Border & Title Block Header -->
  <rect x="25" y="25" width="850" height="550" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="25" y="25" width="850" height="45" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
  
  <text x="45" y="53" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8">PART-FAB-JUNCTION-MANIFOLD-4WAY</text>
  <text x="320" y="53" font-family="sans-serif" font-size="14" font-weight="500" fill="#94a3b8">4-Way Dial-A-Dose Fluidic Manifold Junction Block</text>
  <text x="760" y="53" font-family="monospace" font-size="12" fill="#10b981">CANONICAL CAD</text>

  <!-- Title Block Footer Details -->
  <rect x="480" y="465" width="395" height="110" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <line x1="480" y1="500" x2="875" y2="500" stroke="#334155" stroke-width="1" />
  <line x1="480" y1="535" x2="875" y2="535" stroke="#334155" stroke-width="1" />
  <line x1="675" y1="465" x2="675" y2="575" stroke="#334155" stroke-width="1" />

  <text x="495" y="488" font-family="monospace" font-size="11" fill="#64748b">MATERIAL / FINISH</text>
  <text x="690" y="488" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc">aluminum</text>

  <text x="495" y="523" font-family="monospace" font-size="11" fill="#64748b">FABRICATION METHOD</text>
  <text x="690" y="523" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">CNC Machined Aluminum / Delrin</text>

  <text x="495" y="558" font-family="monospace" font-size="11" fill="#64748b">TOLERANCE / STANDARD</text>
  <text x="690" y="558" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b">ISO 2768-m (±0.05mm)</text>

  <!-- View 1: Front Elevation (Orthographic) -->
  <g transform="translate(70, 110)">
    <text x="0" y="-15" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">VIEW A-A: FRONT ELEVATION</text>
    <rect x="0" y="0" width="220" height="140" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2" />
    <!-- Internal detail pockets -->
    <rect x="30" y="25" width="160" height="90" fill="#0f172a" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.2" />
    <circle cx="60" cy="70" r="12" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="160" cy="70" r="12" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Centerlines -->
    <line x1="-15" y1="70" x2="235" y2="70" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="6,3,1,3" />
    <line x1="110" y1="-15" x2="110" y2="155" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="6,3,1,3" />
    
    <!-- Dimensions -->
    <line x1="0" y1="165" x2="220" y2="165" stroke="#f59e0b" stroke-width="1.2" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)" />
    <text x="95" y="180" font-family="monospace" font-size="11" fill="#f59e0b">110.0 mm</text>
    
    <line x1="-20" y1="0" x2="-20" y2="140" stroke="#f59e0b" stroke-width="1.2" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)" />
    <text x="-55" y="75" font-family="monospace" font-size="11" fill="#f59e0b">48.0 mm</text>
  </g>

  <!-- View 2: Top Plan View -->
  <g transform="translate(370, 110)">
    <text x="0" y="-15" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">VIEW B-B: TOP PLAN VIEW</text>
    <rect x="0" y="0" width="220" height="85" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2" />
    <!-- Keyway & slots -->
    <rect x="80" y="25" width="60" height="35" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <line x1="110" y1="10" x2="110" y2="75" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="6,3,1,3" />
    <!-- Dimensions -->
    <line x1="235" y1="0" x2="235" y2="85" stroke="#f59e0b" stroke-width="1.2" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)" />
    <text x="245" y="47" font-family="monospace" font-size="11" fill="#f59e0b">36.0 mm</text>
  </g>

  <!-- View 3: Right Profile / Section -->
  <g transform="translate(670, 110)">
    <text x="0" y="-15" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">VIEW C-C: SECTION</text>
    <path d="M 0 0 L 140 0 L 140 85 L 70 85 L 70 140 L 0 140 Z" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="2" />
    <line x1="10" y1="20" x2="130" y2="20" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1" />
    <line x1="10" y1="40" x2="130" y2="40" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1" />
  </g>

  <!-- Technical Notes & Datum Indicators -->
  <g transform="translate(70, 360)">
    <text x="0" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#f59e0b">ENGINEERING SPECIFICATIONS &amp; MANDATES:</text>
    <text x="0" y="24" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. ALL UNSPECIFIED RADII R2.0mm. BREAK ALL SHARP EDGES 0.5mm MAX.</text>
    <text x="0" y="44" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. DATUM -A- (MOUNTING FACE): FLATNESS WITHIN 0.05mm TOTAL INDICATOR READING.</text>
    <text x="0" y="64" font-family="sans-serif" font-size="11" fill="#cbd5e1">3. ALL FLUID-CONTACT SURFACES PASSIVATED OR FOOD-GRADE EPOXY SEALED.</text>
    <text x="0" y="84" font-family="sans-serif" font-size="11" fill="#cbd5e1">4. FASTENER RECESS HOLES CONFORM TO DIN 912 COUNTERBORE SPECIFICATIONS.</text>
  </g>
</svg>