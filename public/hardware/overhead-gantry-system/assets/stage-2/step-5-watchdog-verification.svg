<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Blueprint Background -->
  <rect width="960" height="540" fill="#0b1120" />
  
  <defs>
    <pattern id="grid-overhead-gantry-system-2-5" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
      <path d="M 150 0 L 0 0 0 150" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <marker id="arrow-5" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>
  
  <rect width="960" height="540" fill="url(#grid-overhead-gantry-system-2-5)" />
  
  <!-- Outer Technical Blueprint Border -->
  <rect x="25" y="25" width="910" height="490" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="30" y="30" width="900" height="480" fill="none" stroke="#1e293b" stroke-width="1" />
  
  <!-- Blueprint Title Header Block -->
  <rect x="30" y="30" width="900" height="60" fill="#0f172a" opacity="0.95" />
  <line x1="30" y1="90" x2="930" y2="90" stroke="#0ea5e9" stroke-width="2" />
  
  <text x="50" y="52" font-family="monospace" font-size="11" font-weight="bold" fill="#0ea5e9" letter-spacing="2">OPEN BIOSPHERE // RFC-0010 REVERSE-DECONSTRUCTED BLUEPRINT</text>
  <text x="50" y="75" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">2-Axis Overhead Gantry Array // STAGE 2</text>
  
  <rect x="670" y="42" width="240" height="34" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="790" y="64" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">STEP 2.5 // LAYER 5 OF 5</text>
  
  <!-- Datum Line -->
  <line x1="60" y1="440" x2="900" y2="440" stroke="#64748b" stroke-width="1.2" stroke-dasharray="8 4" />
  <text x="900" y="435" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">DATUM Z=0.00 (SOUTH COPING SURFACE)</text>
  
  <!-- Stepwise Geometry Layers -->

  <!-- STEP 1: MUTED FOUNDATION LAYER -->
  <rect x="120" y="320" width="720" height="90" rx="6" fill="#0f172a" fill-opacity="0.5" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 2" />
  <circle cx="160" cy="365" r="5" fill="#334155" />
  <circle cx="800" cy="365" r="5" fill="#334155" />

  <!-- STEP 2: MUTED LAYER -->
  <rect x="180" y="210" width="460" height="110" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 2" />

  <!-- STEP 3: MUTED LAYER -->
  <rect x="660" y="160" width="180" height="160" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 2" />
  <circle cx="750" cy="240" r="30" fill="none" stroke="#334155" stroke-width="1" />

  <!-- STEP 4: MUTED LAYER -->
  <rect x="220" y="130" width="380" height="80" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 2" />

  <!-- STEP 5: ACTIVE FINAL INTEGRATION &amp; HARNESS -->
  <rect x="90" y="105" width="780" height="335" rx="10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 4" />
  <path d="M 100 115 L 860 115 L 860 135 L 100 135 Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
  <text x="480" y="128" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">HERMETIC SEAL &amp; PROTECTIVE COWLING ENVELOPE</text>

  <!-- Step Instruction Callout Box -->
  <rect x="40" y="445" width="880" height="65" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
  <circle cx="65" cy="477" r="14" fill="#0ea5e9" />
  <text x="65" y="482" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">5</text>
  
  <text x="95" y="468" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">STEP 2.5: 250ms Watchdog &amp; Emergency Brake Verification</text>
  <text x="95" y="487" font-family="monospace" font-size="10" fill="#94a3b8">Verifying all stepper drives drop to high-impedance safe state within 250ms of heartbeat loss.</text>
  <text x="95" y="502" font-family="monospace" font-size="9" font-weight="bold" fill="#38bdf8">TIMEOUT: 250ms | SAFE STATE: Steppers Disabled</text>
</svg>