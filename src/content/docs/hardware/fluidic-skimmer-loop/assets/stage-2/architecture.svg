<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background &amp; Engineering Grid -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="25" y="25" width="910" height="490" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header Block -->
  <path d="M 25 25 L 935 25 L 935 85 L 25 85 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="85" x2="935" y2="85" stroke="#a855f7" stroke-width="2"/>
  
  <text x="45" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#a855f7" letter-spacing="2">OPEN BIOSPHERE // TECHNICAL VECTOR SPECIFICATION</text>
  <text x="45" y="74" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Fluidic Skimmer &amp; Dewatering Separator</text>
  
  <rect x="690" y="42" width="245" height="28" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="813" y="61" font-family="monospace" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="middle">STAGE 2 // AGENTIC AUTONOMOUS AI</text>

  <!-- Content Graphic -->
  <g id="drawing-content">

    <!-- Central Controller -->
    <g transform="translate(60, 105)">
      <rect x="0" y="0" width="840" height="85" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
      <text x="20" y="25" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc">CENTRAL BIOSPHERE CONTROLLER (Agnostic Runtime // POTFRM-4096)</text>
      <text x="20" y="45" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Linux / macOS Compute Host (192.168.42.1:8443) • YOLOv8 Canopy Biomass Vision &amp; Coordination</text>
      <text x="20" y="65" font-family="monospace" font-size="10" fill="#94a3b8">Emits Isolated Farm Wi-Fi AP: SSID [POTFRM-4096] • Zero External Cloud Telemetry</text>
      
      <!-- Downward Wi-Fi Link -->
      <line x1="420" y1="85" x2="420" y2="125" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowPurple)"/>
    </g>

    <!-- Skimmer Machine Node -->
    <g transform="translate(180, 220)">
      <rect x="0" y="0" width="600" height="80" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="20" y="25" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">SKIMMER MACHINE NODE (ESP32-S3 Dual-Core)</text>
      <text x="20" y="45" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Coordinates Local Harvesting Logic, 250ms Fail-Safe Watchdogs &amp; Sump Flow</text>
      <text x="20" y="65" font-family="monospace" font-size="10" fill="#cbd5e1">OLED Display: [NODE: SKIMMER-01 | LINK -&gt; 4096] • Wi-Fi Uplink / BLE Downlink</text>
    </g>

    <!-- BLE Fan-Out Links -->
    <path d="M 230 300 L 140 345" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <path d="M 390 300 L 340 345" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <path d="M 570 300 L 540 345" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <path d="M 730 300 L 740 345" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

    <!-- Dedicated Edge Tools -->
    <!-- Tool 1: Weir Actuator -->
    <g transform="translate(50, 350)">
      <rect x="0" y="0" width="190" height="105" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" font-family="monospace" font-size="10" font-weight="bold" fill="#10b981">TOOL: DEV_WEIR_ACT</text>
      <text x="15" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">12V Linear Actuator</text>
      <text x="15" y="58" font-family="monospace" font-size="9" fill="#94a3b8">ESP32-C3 Edge Micro</text>
      <text x="15" y="74" font-family="monospace" font-size="9" fill="#94a3b8">0.42" OLED Display</text>
      <rect x="15" y="80" width="160" height="18" rx="3" fill="#ef4444" opacity="0.2"/>
      <text x="95" y="93" font-family="monospace" font-size="9" fill="#ef4444" text-anchor="middle">250ms Deadman Snaps Shut</text>
    </g>

    <!-- Tool 2: Auger Stepper -->
    <g transform="translate(260, 350)">
      <rect x="0" y="0" width="190" height="105" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" font-family="monospace" font-size="10" font-weight="bold" fill="#10b981">TOOL: DEV_AUGER_STEP</text>
      <text x="15" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">NEMA 23 Auger Stepper</text>
      <text x="15" y="58" font-family="monospace" font-size="9" fill="#94a3b8">ESP32-C3 Edge Micro</text>
      <text x="15" y="74" font-family="monospace" font-size="9" fill="#94a3b8">0.42" OLED Display</text>
      <rect x="15" y="80" width="160" height="18" rx="3" fill="#ef4444" opacity="0.2"/>
      <text x="95" y="93" font-family="monospace" font-size="9" fill="#ef4444" text-anchor="middle">250ms Deadman Cuts Step</text>
    </g>

    <!-- Tool 3: Pump VFD -->
    <g transform="translate(470, 350)">
      <rect x="0" y="0" width="190" height="105" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" font-family="monospace" font-size="10" font-weight="bold" fill="#10b981">TOOL: DEV_PUMP_VFD</text>
      <text x="15" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Pump VFD Throttle</text>
      <text x="15" y="58" font-family="monospace" font-size="9" fill="#94a3b8">ESP32-C3 Edge Micro</text>
      <text x="15" y="74" font-family="monospace" font-size="9" fill="#94a3b8">0.42" OLED Display</text>
      <rect x="15" y="80" width="160" height="18" rx="3" fill="#ef4444" opacity="0.2"/>
      <text x="95" y="93" font-family="monospace" font-size="9" fill="#ef4444" text-anchor="middle">250ms Deadman Idle Flow</text>
    </g>

    <!-- Tool 4: Sump Level -->
    <g transform="translate(680, 350)">
      <rect x="0" y="0" width="190" height="105" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" font-family="monospace" font-size="10" font-weight="bold" fill="#10b981">TOOL: DEV_SUMP_LEVEL</text>
      <text x="15" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Ultrasonic + Dual Floats</text>
      <text x="15" y="58" font-family="monospace" font-size="9" fill="#94a3b8">ESP32-C3 Edge Micro</text>
      <text x="15" y="74" font-family="monospace" font-size="9" fill="#94a3b8">0.42" OLED Display</text>
      <rect x="15" y="80" width="160" height="18" rx="3" fill="#ef4444" opacity="0.2"/>
      <text x="95" y="93" font-family="monospace" font-size="9" fill="#ef4444" text-anchor="middle">Hardware Overflow Interlock</text>
    </g>

  </g>

  <!-- Blueprint Title Block Footer -->
  <path d="M 25 485 L 935 485 L 935 515 L 25 515 Z" fill="#0f172a" opacity="0.9"/>
  <line x1="25" y1="485" x2="935" y2="485" stroke="#334155" stroke-width="1.5"/>

  <text x="45" y="505" font-family="monospace" font-size="10" fill="#94a3b8">SUBTITLE: <tspan fill="#f8fafc">Controller-Node-Tool (CNT) Hierarchical Edge Architecture</tspan></text>
  <text x="690" y="505" font-family="monospace" font-size="10" fill="#94a3b8">STANDARD: <tspan fill="#a855f7" font-weight="bold">RFC-0011 VECTOR SVG</tspan></text>
</svg>